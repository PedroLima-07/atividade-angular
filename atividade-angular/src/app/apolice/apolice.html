<div class="container mt-4">
  <h3>Apólice de Seguro</h3>

  <div class="mb-3">
    <label class="form-label">Nome do Segurado</label>
    <input type="text" [(ngModel)]="nome" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Sexo</label>
    <select [(ngModel)]="sexo" class="form-control">
      <option value="M">Masculino</option>
      <option value="F">Feminino</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Idade</label>
    <input type="number" [(ngModel)]="idade" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">Valor do Automóvel</label>
    <input type="number" [(ngModel)]="valorAutomovel" class="form-control" />
  </div>

  <button class="btn btn-primary" (click)="calcular()">Calcular</button>

  @if (calculado) {
    <div class="alert alert-info mt-3">
      Segurado: {{ nome }} — Valor da Apólice: R$ {{ valorApolice | number:'1.2-2' }}
    </div>
  }
</div>
